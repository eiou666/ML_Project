project:
  output_dir: outputs/smoke
  active_output_dir: outputs/smoke-active
  experiment_name: smoke

data:
  name: synthetic
  root: data
  download: false
  label_ratio: 0.10
  validation_fraction: 0.10
  num_workers: 0
  pin_memory: false
  synthetic_train_size: 1000
  synthetic_test_size: 200

model:
  num_classes: 10
  dropout: 0.20

method:
  name: supervised
  tau: 0.95
  lambda_u: 1.0

train:
  seed: 0
  device: auto
  steps: 3
  batch_labeled: 16
  batch_unlabeled: 32
  learning_rate: 0.003
  weight_decay: 0.0001
  warmup_steps: 1
  ema_decay: 0.99
  eval_interval: 1
  log_interval: 1
  gradient_clip_norm: 5.0
  amp: false
  deterministic: true

active:
  strategy: none
  initial_ratio: 0.10
  query_size: 20
  rounds: 1
  candidate_multiplier: 3
